<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>JEANCUL — 200% CHIN</title>
<meta name="description" content="JEANCUL. The chin was only the beginning.">
<style>
:root{--bg:#070707;--fg:#f5f1e8;--hot:#ffdc35;--pink:#ff4fa3}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial Black,Impact,system-ui,sans-serif;overflow-x:hidden}
body{min-height:100svh}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.055;z-index:30;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}
.intro{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;animation:introOut .85s cubic-bezier(.7,0,.2,1) 3.5s forwards}
.intro img{width:min(92vw,760px);height:min(92svh,850px);object-fit:contain;filter:contrast(1.08) saturate(.95)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash .22s ease 2.75s}
.introTitle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.3);font-size:clamp(4rem,18vw,13rem);letter-spacing:-.07em;opacity:0;text-shadow:0 8px 0 #000;animation:titleHit .65s cubic-bezier(.15,1.4,.35,1) 2.85s forwards}
@keyframes flash{50%{opacity:.85}} @keyframes titleHit{to{opacity:1;transform:translate(-50%,-50%) scale(1)}} @keyframes introOut{to{opacity:0;visibility:hidden;transform:scale(1.08)}}
.hero{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;position:relative;padding:20px;isolation:isolate}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.18em;text-transform:uppercase;z-index:4}
.badge{border:1px solid #ffffff55;border-radius:999px;padding:8px 12px}
.siteHeader{position:relative;z-index:6}
.contract{display:flex;align-items:center;gap:10px;width:100%;margin-top:16px;padding:10px 12px;border:1px solid #ffdc3577;border-radius:7px;background:#ffdc3512;color:var(--fg);cursor:pointer;text-align:left}
.contract:hover,.contract:focus-visible{border-color:var(--hot);outline:none}
.contractLabel,.copyFeedback{flex:none;color:var(--hot);font-size:11px;font-weight:900;letter-spacing:.1em}
.contract code{font:600 12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;min-width:0}
.copyFeedback{margin-left:auto;white-space:nowrap}
.stage{display:grid;place-items:center;position:relative;min-height:70svh}
.word{position:absolute;font-size:clamp(5rem,21vw,18rem);line-height:.75;letter-spacing:-.08em;opacity:.1;white-space:nowrap;z-index:-1;transform:rotate(-5deg)}
.faceWrap{position:relative;width:min(88vw,690px);user-select:none;filter:drop-shadow(0 28px 35px #000)}
.face{display:block;width:100%;height:auto;pointer-events:none}
.chinCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.chinHotspot{position:absolute;left:25%;top:54%;width:39%;height:22%;border:0;background:transparent;border-radius:45% 45% 55% 55%;z-index:5;touch-action:none;cursor:grab}
.chinHotspot:active{cursor:grabbing}
.chinHotspot:focus-visible{outline:3px solid var(--hot)}
.hint{position:absolute;right:3%;bottom:15%;font-family:system-ui,sans-serif;font-weight:800;font-size:12px;letter-spacing:.12em;transform:rotate(-8deg);background:var(--hot);color:#111;padding:8px 11px;border-radius:4px;box-shadow:5px 5px 0 #fff}
.bottom{display:flex;gap:14px;align-items:end;justify-content:space-between;z-index:5}
.copy h1{margin:0;font-size:clamp(2.3rem,8vw,6.5rem);letter-spacing:-.06em;line-height:.85}
.copy p{font-family:system-ui,sans-serif;font-weight:700;margin:.8rem 0 0;opacity:.68}
.tg{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;background:var(--hot);color:#090909;padding:16px 20px;border-radius:999px;font-size:14px;white-space:nowrap;box-shadow:0 0 0 0 #fff;transition:.2s}
.tg:hover{transform:translateY(-3px) rotate(-1deg);box-shadow:0 7px 0 #fff}
.counter{position:fixed;left:14px;bottom:14px;font-family:ui-monospace,monospace;font-size:11px;opacity:.55;z-index:10}
.burst{position:fixed;pointer-events:none;z-index:100;font-size:clamp(2rem,8vw,6rem);font-weight:1000;animation:pop .7s ease-out forwards}
@keyframes pop{from{opacity:1;transform:translate(-50%,-50%) scale(.2) rotate(-10deg)}to{opacity:0;transform:translate(-50%,-140%) scale(1.2) rotate(8deg)}}
@media(max-width:620px){.hero{padding:14px}.bottom{align-items:stretch;flex-direction:column}.tg{width:100%}.hint{bottom:9%;right:0}.stage{min-height:66svh}.faceWrap{width:98vw}.contract{align-items:flex-start;flex-wrap:wrap;gap:5px 10px}.contract code{order:3;width:100%}.copyFeedback{margin-left:auto}}
@media(prefers-reduced-motion:reduce){.intro{display:none}}
</style>
</head>
<body>
<div class="noise"></div>
<div class="intro"><img src="jeancul.png" alt=""><div class="flash"></div><div class="introTitle">JEANCUL</div></div>

<main class="hero">
  <header class="siteHeader">
    <div class="top"><span>$JEANCUL</span><span class="badge">NO ROADMAP · JUST CHIN</span></div>
    <button class="contract" id="contract" type="button" aria-label="Copy token contract address"><span class="contractLabel">CA</span><code>8yyuxavUNEqB6Qa444n4cJrGvmfKWpfM4vz5qmP7pump</code><span class="copyFeedback" id="copyFeedback" aria-live="polite">COPY ↗</span></button>
  </header>
  <section class="stage">
    <div class="word">JEANCUL</div>
    <div class="faceWrap" id="faceWrap">
      <img class="face" id="face" src="jeancul.png" alt="JEANCUL">
      <canvas class="chinCanvas" id="chinCanvas" aria-hidden="true"></canvas>
      <button class="chinHotspot" id="chin" type="button" aria-label="Swing the chin"></button>
      <div class="hint">↔ TWERK THE CHIN</div>
    </div>
  </section>
  <div class="bottom">
    <div class="copy"><h1>200% CHIN.<br>0% ROADMAP.</h1><p>The chin was only the beginning.</p></div>
    <a class="tg" href="https://t.me/JEANCULTG" target="_blank" rel="noopener noreferrer">JOIN TELEGRAM ↗</a>
  </div>
</main>
<div class="counter"><span id="count">0</span> CHIN SLAPS</div>

<script>
const face=document.getElementById('face');
const chin=document.getElementById('chin');
const canvas=document.getElementById('chinCanvas');
const countEl=document.getElementById('count');
const contract=document.getElementById('contract');
const copyFeedback=document.getElementById('copyFeedback');
contract.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText('8yyuxavUNEqB6Qa444n4cJrGvmfKWpfM4vz5qmP7pump');copyFeedback.textContent='COPIED ✓'}
  catch{copyFeedback.textContent='COPY FAILED'}
  setTimeout(()=>copyFeedback.textContent='COPY ↗',1800);
});
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
let dragging=false, startX=0, dragX=0, impulse=0, phase=0, slaps=0, lastFrame=0;

function startChin(){
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  if(!ctx)return;
  canvas.width=face.naturalWidth;
  canvas.height=face.naturalHeight;
  const box={x:290,y:815,w:510,h:350};
  const source=document.createElement('canvas');
  source.width=box.w;source.height=box.h;
  const sourceCtx=source.getContext('2d',{willReadFrequently:true});
  sourceCtx.drawImage(face,box.x,box.y,box.w,box.h,0,0,box.w,box.h);
  let pixels;
  try{pixels=sourceCtx.getImageData(0,0,box.w,box.h).data}catch{return}
  const frame=ctx.createImageData(box.w,box.h);
  const weights=new Float32Array(box.w*box.h*2);
  const edge=(d)=>clamp(d/28,0,1);
  for(let y=0;y<box.h;y++)for(let x=0;x<box.w;x++){
    const px=x+box.x,py=y+box.y;
    const fade=edge(Math.min(x,y,box.w-1-x,box.h-1-y));
    const i=(y*box.w+x)*2;
    weights[i]=fade*Math.exp(-(((px-435)/105)**2+((py-1005)/112)**2)*1.3);
    weights[i+1]=fade*Math.exp(-(((px-610)/110)**2+((py-1000)/112)**2)*1.3);
  }
  function paint(time){
    requestAnimationFrame(paint);
    if(time-lastFrame<32)return;
    const dt=Math.min((time-lastFrame)||33,60);lastFrame=time;
    if(!reducedMotion.matches)phase+=dt*.004;
    if(!dragging){dragX*=.88;impulse*=.91}
    const left=(reducedMotion.matches?0:Math.sin(phase)*15)+dragX*.36+impulse;
    const right=(reducedMotion.matches?0:Math.sin(phase+1.5)*15)+dragX*.28-impulse*.72;
    const lift=reducedMotion.matches?0:Math.sin(phase*1.4)*4;
    for(let y=0;y<box.h;y++)for(let x=0;x<box.w;x++){
      const n=y*box.w+x,i=n*4,wi=n*2;
      const w1=weights[wi],w2=weights[wi+1];
      const sx=clamp(Math.round(x-w1*left-w2*right),0,box.w-1);
      const sy=clamp(Math.round(y-(w1+w2)*lift),0,box.h-1);
      const si=(sy*box.w+sx)*4;
      frame.data[i]=pixels[si];frame.data[i+1]=pixels[si+1];
      frame.data[i+2]=pixels[si+2];frame.data[i+3]=255;
    }
    ctx.putImageData(frame,box.x,box.y);
  }
  requestAnimationFrame(paint);
}
if(face.complete&&face.naturalWidth)startChin();else face.addEventListener('load',startChin,{once:true});
chin.addEventListener('pointerdown',e=>{
  dragging=true;startX=e.clientX;dragX=0;
  chin.setPointerCapture(e.pointerId);
});
chin.addEventListener('pointermove',e=>{
  if(dragging)dragX=clamp((e.clientX-startX)*face.naturalWidth/face.getBoundingClientRect().width,-85,85);
});
function release(){dragging=false;impulse=clamp(dragX*.35,-24,24)}
chin.addEventListener('pointerup',release);
chin.addEventListener('pointercancel',release);
chin.addEventListener('click',e=>{
  if(Math.abs(dragX)>10)return;
  slaps++;countEl.textContent=slaps;
  impulse=(slaps%2?1:-1)*28;
  const b=document.createElement('div');b.className='burst';
  b.textContent=['WOBBLE!','CLAP!','JEANCUL!'][slaps%3];
  const r=chin.getBoundingClientRect();
  b.style.left=(e.clientX||r.left+r.width/2)+'px';
  b.style.top=(e.clientY||r.top+r.height/2)+'px';
  document.body.appendChild(b);setTimeout(()=>b.remove(),700);
});
</script>
</body>
</html>
